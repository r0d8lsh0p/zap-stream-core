# Railway deployment config for zap-stream-external
#
# NOTE (corrected 2026-10-02): an earlier version of this comment claimed that a
# value present in this file makes the matching environment variable "COMPLETELY
# IGNORED". That was WRONG. The `config` crate adds the Environment source AFTER the
# file, and later sources win, so environment variables DO override file values.
# Verified by unit test (see env_overrides_file_scalar).
#
# Two real caveats:
#  - `payments` is an externally-tagged pick-one enum. You cannot switch backend by
#    adding APP__PAYMENTS__LNURL__ADDRESS on top of a file that sets payments.lnd --
#    the two keys merge and deserialization fails. Replace the whole file instead.
#  - `relays` is a list. Plain env vars cannot parse "a,b" into Vec<String>; it needs
#    try_parsing + list_separator (see env_source()). Without that code, setting
#    APP__RELAYS crash-loops the service.
#
# This file is superseded for staging -- see notes/deployment-model.md. It is still
# baked into the PRODUCTION image until production is migrated.

# Database connection string
# Set via Railway env var: APP__DATABASE
# database: "mysql://..."

# Public URL of the HTTP server
# Set via Railway env var: APP__PUBLIC_URL
# public_url: "https://api.shosho.live"

# Bind address for HTTP server
listen_http: "[::]:8080"

# Terms URL (defaults to https://zap.stream/tos)
tos_url: "https://shosho.live/docs/terms"

# Client URL for "alt" tag "Watch live on" (defaults to https://zap.stream)
client_url: "https://shosho.live/live"

# Public hostname for ingest endpoints (custom RTMPS domain)
# See https://developers.cloudflare.com/stream/stream-live/custom-domains/
# DO NOT include http:// here e.g. "domain.name" NOT "http://domain.name"
# Set via Railway env var: APP__ENDPOINTS_PUBLIC_HOSTNAME
# endpoints_public_hostname: "ingest.shosho.live"

# Primary nsec key for publishing stream events
# Set via Railway env var: APP__NSEC
# nsec: "nsec1..."

# Nostr relays to publish to
relays:
  - "wss://relay.shosho.live"
  - "wss://nos.lol"
  - "wss://relay.snort.social"
  - "wss://relay.damus.io"
  - "wss://relay.fountain.fm"
  - "wss://relay.primal.net"

# Cloudflare API credentials
# Set via Railway env vars:
# APP__CLOUDFLARE__TOKEN=<your_api_token>
# APP__CLOUDFLARE__ACCOUNT_ID=<your_account_id>
# cloudflare:
#   token: "..."
#   account_id: "..."

# Lightning node config
payments:
  # LUD-21 is required to use a lightning address backend
  lnurl:
    address: "rb@rodbishop.nz"
  #bitvora:
  #  api_token: "abc123"
  #  webhook_secret: "abc123"
  #nwc:
  #  url: "nostr+walletconnect://..."
  #lnd:
  #  address: "https://127.0.0.1:10001"
  #  cert: "/path/to/tls.cert"
  #  macaroon: "/path/to/admin.macaroon"
